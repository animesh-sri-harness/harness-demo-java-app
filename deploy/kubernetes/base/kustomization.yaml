apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harness-demo
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - service-stage.yaml
  - pdb.yaml
  - hpa.yaml
  - networkpolicy.yaml
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
    includeTemplates: true
