apiVersion: v1
kind: Service
metadata:
  name: {{ include "harness-demo-java-app.fullname" . }}
  labels:
    {{- include "harness-demo-java-app.labels" . | nindent 4 }}
  annotations:
    harness.io/primary-service: "true"
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "harness-demo-java-app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.stageService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "harness-demo-java-app.fullname" . }}-stage
  labels:
    {{- include "harness-demo-java-app.labels" . | nindent 4 }}
  annotations:
    harness.io/stage-service: "true"
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "harness-demo-java-app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
